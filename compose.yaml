services:
  app:
    build: .
    image: nawaz77/devops-project:latest
    container_name: devops-compose-app
    ports:
      - "5002:5000"
    env_file:
      - .env
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: devops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: